name: iOS JVM smoke test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: .cache/jre17
          key: amethyst-ios-jre17-20260708

      - name: Build ARM64 simulator app
        run: ./build.sh

      - name: Boot simulator and verify Java
        run: ./test.sh

      - name: Upload app and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quackduck-ios-jvm-spike-${{ github.run_number }}
          path: |
            build/QuackDuckJVM.zip
            build/screenshot.png
            build/java-ok.txt
            build/app.log
          if-no-files-found: ignore

